name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    name: gradle build (${{ matrix.os }})
    # RNF-06: o Desktop roda em Windows 10/11 e Linux (Ubuntu LTS)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Também valida o checksum do gradle-wrapper.jar
      - uses: gradle/actions/setup-gradle@v6

      - name: Compilar e rodar os testes
        shell: bash
        run: ./gradlew build
