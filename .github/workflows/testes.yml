name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    name: gradle build (${{ matrix.os }})
    # RNF-06: o Desktop roda em Windows 10/11 e Linux (Ubuntu LTS)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Motor de cálculo real para os testes de integração (instalado da release, como em docs/.../5.1)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar o motor de cálculo
        shell: bash
        run: |
          python -m venv .motor
          if [ "$RUNNER_OS" = "Windows" ]; then py=.motor/Scripts/python; else py=.motor/bin/python; fi
          $py -m pip install --quiet "https://github.com/LDTLuis/modulo-calculo-api/releases/download/v${MOTOR_VERSAO}/damiq_calc-${MOTOR_VERSAO}-py3-none-any.whl"
        env:
          MOTOR_VERSAO: "1.0.1"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Também valida o checksum do gradle-wrapper.jar
      - uses: gradle/actions/setup-gradle@v6

      - name: Compilar e rodar os testes
        shell: bash
        run: ./gradlew build
        env:
          DAMIQ_MOTOR_OBRIGATORIO: "true"
