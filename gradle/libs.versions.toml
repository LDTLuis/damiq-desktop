[versions]
junit = "5.14.4"
mockito = "5.24.0"
spring = "7.0.9"
jackson = "3.2.3"
sqlite-jdbc = "3.53.4.0"
flyway = "13.8.1"
poi = "5.5.1"
log4j = "2.26.1"
slf4j = "2.0.20"
logback = "1.6.5"
spring-security = "7.1.1"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }

spring-context = { module = "org.springframework:spring-context", version.ref = "spring" }
# bcrypt para conferir as senhas no aparelho (só a classe BCrypt; sem o resto do Spring Security)
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto", version.ref = "spring-security" }

jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }

sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
# o POI registra logs pelo Log4j 2; esta ponte os envia ao SLF4J/Logback
log4j-to-slf4j = { module = "org.apache.logging.log4j:log4j-to-slf4j", version.ref = "log4j" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
